    <script>
        (function() {
            // ============================================================
            //  KONFIGURASI - WORKER (TANPA TOKEN DI HTML!)
            // ============================================================
            const WORKER_URL = 'https://jadwalpkt.dukopbabinsa05.workers.dev';

            // ============================================================
            //  KONFIGURASI - SATRIYO DI INDEKS 0
            // ============================================================
            const START_DATE = new Date(2026, 6, 25);
            const START_INDEX = 0;

            const HANPANGAN_URL = "https://raw.githubusercontent.com/sukasada05/dukops4/main/data/hanpangan.csv";
            const PIKET_URL = "https://raw.githubusercontent.com/sukasada05/dukops4/main/data/piket.txt";
            const SUPABASE_URL = 'https://wausfsflcehizpuqdwbg.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhdXNmc2ZsY2VoaXpwdXFkd2JnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMTA3ODQsImV4cCI6MjA5ODY4Njc4NH0.2zF7iogzuTwWoQc451-uKxQdNN1C-qkB0O9Jvz1ZoI0';

            let supabaseClient = null;
            let isSupabaseConnected = false;
            let daftarNama = [];
            let hanpanganData = [];
            let currentHanpangan = null;
            let allJadwal = [];
            let isSaving = false;
            let isReloading = false;
            let lastReloadTime = 0;
            let isInitialLoad = true;

            const bulanSelect = document.getElementById('bulanSelect');
            const bulanTahunTitle = document.getElementById('bulanTahunTitle');
            const previewContainer = document.getElementById('previewContainer');
            const toast = document.getElementById('toastMessage');
            const indicator = document.getElementById('supabaseIndicator');
            const totalHariSpan = document.getElementById('totalHari');
            const workerDot = document.getElementById('workerDot');
            const workerStatusText = document.getElementById('workerStatusText');
            const btnKirim = document.getElementById('btnKirim');

            // ============================================================
            //  NAMA HARI & BULAN
            // ============================================================
            const NAMA_HARI = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
            const NAMA_BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September",
                "Oktober", "November", "Desember"
            ];

            // ============================================================
            //  EPOCH DAY
            // ============================================================
            function getEpochDay(date) {
                const ref = new Date(2024, 0, 1);
                ref.setHours(0, 0, 0, 0);
                const d = new Date(date);
                d.setHours(0, 0, 0, 0);
                const diffTime = d.getTime() - ref.getTime();
                return Math.floor(diffTime / (24 * 60 * 60 * 1000));
            }

            function getHanpanganToday(data, date) {
                if (!data || data.length === 0) return null;
                const startEpoch = getEpochDay(START_DATE);
                const todayEpoch = getEpochDay(date);
                const dayDiff = todayEpoch - startEpoch;
                const idx = ((START_INDEX + dayDiff) % data.length + data.length) % data.length;
                return data[idx];
            }

            function formatTanggalIndonesia(date) {
                return NAMA_HARI[date.getDay()] + ', ' +
                    date.getDate() + ' ' +
                    NAMA_BULAN[date.getMonth()] + ' ' +
                    date.getFullYear();
            }

            function formatTanggalDuaBaris(date) {
                return NAMA_HARI[date.getDay()] + ',\n' +
                    date.getDate() + ' ' +
                    NAMA_BULAN[date.getMonth()] + ' ' +

            function formatTanggalWA(date) {
                return NAMA_HARI[date.getDay()] + ', ' +
                    date.getDate() + ' ' +
                    NAMA_BULAN[date.getMonth()] + ' ' +
                    date.getFullYear();

            // ============================================================
            //  PARSE CSV
            // ============================================================
            function parseCSV(csvText) {
                const lines = csvText.trim().split('\n');
                if (lines.length < 2) return [];

                const headerLine = lines[0];
                let delimiter = '\t';
                if (headerLine.includes('\t')) delimiter = '\t';
                else if (headerLine.includes(',')) delimiter = ',';
                else if (headerLine.includes(';')) delimiter = ';';

                const data = [];
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    const cols = line.split(delimiter);
                    if (cols.length >= 3) {
                        data.push({
                            nama: cols[0].trim(),
                            desa: cols[1].trim(),
                            status: cols[2].trim()
                        });
                    }
                }
                return data;
            }

            // ============================================================
            //  SAVE JADWAL
            // ============================================================
            async function saveJadwal(tanggal, jenis, nama) {
                if (!supabaseClient || !isSupabaseConnected) {
                    showToast('⚠️ Supabase tidak terhubung!', 'error');
                    return false;
                }

                if (isSaving) return false;
                isSaving = true;

                const cells = document.querySelectorAll(`td[data-jenis="${jenis}"]`);
                let targetCell = null;
                for (let cell of cells) {
                    const row = cell.closest('tr');
                    if (row && row.dataset.tanggal === tanggal) {
                        targetCell = cell;
                        break;
                    }
                }

                if (targetCell) {
                    showSaveIndicator(targetCell, 'saving');
                }

                try {
                    const { data: existing, error: findErr } = await supabaseClient
                        .from('jadwal_piket')
                        .select('id, nama1, nama2')
                        .eq('tanggal_jadwal', tanggal)
                        .eq('jenis', jenis)
                        .maybeSingle();
                    if (findErr) throw findErr;

                    const oldValue = existing ? (existing.nama1 || '') : '';
                    const newValue = nama || '';

                    if (oldValue === newValue) {
                        if (targetCell) {
                            showSaveIndicator(targetCell, 'saved');
                            setTimeout(() => {
                                showSaveIndicator(targetCell, '');
                            }, 1000);
                        }
                        isSaving = false;
                        return true;
                    }

                    let result;
                    if (existing) {
                        result = await supabaseClient
                            .from('jadwal_piket')
                            .update({
                                nama1: nama || null,
                                nama2: null,
                                tanggal_input: new Date().toISOString()
                            })
                            .eq('id', existing.id);
                    } else {
                        result = await supabaseClient
                            .from('jadwal_piket')
                            .insert([{
                                tanggal_jadwal: tanggal,
                                jenis: jenis,
                                nama1: nama || null,
                                nama2: null,
                                tanggal_input: new Date().toISOString()
                            }]);
                    }
                    if (result.error) throw result.error;

                    console.log('✅ Save success:', tanggal, jenis, nama);

                    if (targetCell) {
                        showSaveIndicator(targetCell, 'saved');
                    }

                    if (nama && nama.trim() !== '') {
                        const jenisLabel = jenis.replace('_hari_ini', '').toUpperCase();
                        const tgl = new Date(tanggal + 'T00:00:00');
                        const tglStr = formatTanggalIndonesia(tgl);

                        const names = nama.split(',').map(s => s.trim()).filter(s => s);
                        let namaFormatted = '';
                        if (names.length > 0) {
                            namaFormatted = names.map((n, i) => (i + 1) + '. ' + n).join('\n');
                        }

                        const pesan = `📋 *Jadwal Piket Diupdate !*\n\n` +
                            `📅 Tanggal: ${tglStr}\n` +
                            `👤 ${jenisLabel}:\n${namaFormatted}\n\n` +
                            `🔄 Data jadwal telah diperbarui.`;

                        await sendToTelegramViaWorker(pesan);
                    }

                    setTimeout(() => {
                        loadAllJadwal();
                    }, 500);

                    return true;
                } catch (e) {
                    console.error('❌ Gagal simpan:', e);
                    if (targetCell) {
                        showSaveIndicator(targetCell, 'error');
                    }
                    showToast('❌ Gagal simpan: ' + e.message, 'error');
                    return false;
                } finally {
                    isSaving = false;
                }
            }

            // ============================================================
            //  KIRIM KE WHATSAPP + TELEGRAM (1 FUNGSI - LANGSUNG KIRIM!)
            // ============================================================
            async function kirimKeWhatsAppDanTelegram() {
                if (!supabaseClient || !isSupabaseConnected) {
                    showToast('⚠️ Supabase tidak terhubung!', 'error');
                    return;
                }

                // Disable tombol saat proses
                btnKirim.disabled = true;
                btnKirim.innerHTML = '<span class="spinner"></span> Mengirim...';

                try {
                    showToast('⏳ Menyiapkan pesan...', 'info');

                    const today = new Date();
                    const tomorrow = new Date(today);
                    tomorrow.setDate(tomorrow.getDate() + 1);

                    const todayStr = today.getFullYear() + '-' +
                        String(today.getMonth() + 1).padStart(2, '0') + '-' +
                        String(today.getDate()).padStart(2, '0');

                    const tomorrowStr = tomorrow.getFullYear() + '-' +
                        String(tomorrow.getMonth() + 1).padStart(2, '0') + '-' +
                        String(tomorrow.getDate()).padStart(2, '0');

                    const { data, error } = await supabaseClient
                        .from('jadwal_piket')
                        .select('*')
                        .in('tanggal_jadwal', [todayStr, tomorrowStr]);

                    if (error) throw error;

                    const grouped = {};
                    data.forEach(item => {
                        const key = item.tanggal_jadwal;
                        if (!grouped[key]) {
                            grouped[key] = { koramil: '', kediaman: '', makodim: '' };
                        }
                        if (item.jenis === 'koramil_hari_ini') {
                            grouped[key].koramil = item.nama1 || '';
                        } else if (item.jenis === 'kediaman_hari_ini') {
                            grouped[key].kediaman = item.nama1 || '';
                        } else if (item.jenis === 'makodim_hari_ini') {
                            grouped[key].makodim = item.nama1 || '';
                        }
                    });

                    const tglHariIni = formatTanggalWA(today);
                    const tglBesok = formatTanggalWA(tomorrow);

                    let pesan = '';
                    pesan += '_____________________________\n';
                    pesan += '*KORAMIL 1609-05/SUKASADA*\n';
                    pesan += '    *JADWAL DINAS DALAM*\n';
                    pesan += '_____________________________\n\n';

                    function formatNamaWA(namaStr) {
                        if (!namaStr) return '';
                        const names = namaStr.split(',').map(s => s.trim()).filter(s => s);
                        if (names.length === 0) return '';
                        return names.map((n, i) => '   ' + (i + 1) + '. ' + n).join('\n');
                    }

                    let sections = [];
                    let letter = 'A';

                    function addSection(date, names, type) {
                        if (names && names.trim() !== '') {
                            let label = letter + '.';
                            let title = date;
                            if (type) title += ' (' + type + ')';
                            sections.push({ label, title, names });
                            letter = String.fromCharCode(letter.charCodeAt(0) + 1);
                        }
                    }

                    const koramilHariIni = grouped[todayStr]?.koramil || '';
                    const koramilBesok = grouped[tomorrowStr]?.koramil || '';
                    const kediamanHariIni = grouped[todayStr]?.kediaman || '';
                    const kediamanBesok = grouped[tomorrowStr]?.kediaman || '';
                    const makodimHariIni = grouped[todayStr]?.makodim || '';
                    const makodimBesok = grouped[tomorrowStr]?.makodim || '';

                    addSection(tglHariIni, koramilHariIni, '');
                    addSection(tglBesok, koramilBesok, '');
                    addSection(tglHariIni, kediamanHariIni, 'Kediaman');
                    addSection(tglBesok, kediamanBesok, 'Kediaman');
                    addSection(tglHariIni, makodimHariIni, 'Makodim');
                    addSection(tglBesok, makodimBesok, 'Makodim');

                    if (sections.length === 0) {
                        pesan += 'Belum ada data jadwal untuk hari ini dan besok.\n\n';
                    } else {
                        sections.forEach((sec, idx) => {
                            pesan += sec.label + ' ' + sec.title + '\n';
                            pesan += formatNamaWA(sec.names) + '\n';
                            if (idx < sections.length - 1) {
                                pesan += '\n';
                            }
                        });
                        pesan += '\n';
                    }

                    if (currentHanpangan) {
                        pesan += '🌾 *JADWAL HANPANGAN HARI INI:* ' + currentHanpangan.nama + ' 🌾\n';
                    } else {
                        pesan += '🌾 *JADWAL HANPANGAN HARI INI:* Belum tersedia 🌾\n';
                    }
                    pesan += '\n*Demikian MMP.*';

                    // ============================================================
                    //  1. KIRIM KE TELEGRAM VIA WORKER (LANGSUNG, TANPA POPUP)
                    // ============================================================
                    console.log('📤 Mengirim ke Telegram via Worker...');
                    const telegramResult = await sendToTelegramViaWorker(pesan);

                    // ============================================================
                    //  2. KIRIM KE WHATSAPP (LANGSUNG BUKA WA, TANPA POPUP KONFIRMASI)
                    // ============================================================
                    console.log('📤 Membuka WhatsApp...');
                    const encoded = encodeURIComponent(pesan);
                    const waUrl = 'https://api.whatsapp.com/send?text=' + encoded;
                    window.open(waUrl, '_blank');

                    // ============================================================
                    //  3. NOTIFIKASI HASIL
                    // ============================================================
                    if (telegramResult) {
                        showToast('✅ Pesan terkirim ke Telegram & WhatsApp!', 'success');
                    } else {
                        showToast('⚠️ Telegram gagal, tapi WhatsApp terbuka', 'error');
                    }

                } catch (e) {
                    console.error('❌ Error:', e);
                    showToast('❌ Gagal: ' + e.message, 'error');
                } finally {
                    // Enable tombol kembali
                    btnKirim.disabled = false;
                    btnKirim.innerHTML = '<i class="fab fa-whatsapp"></i> <i class="fab fa-telegram-plane"></i> Kirim WA & Telegram';
                }
            }

            // ============================================================
            //  BULAN
            // ============================================================
            function populateBulan() {
                const now = new Date();
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();

                const allMonths = [];
                for (let year = currentYear - 2; year <= currentYear + 2; year++) {
                    for (let m = 0; m < 12; m++) {
                        allMonths.push({
                            value: year + '-' + String(m + 1).padStart(2, '0'),
                            label: NAMA_BULAN[m] + ' ' + year,
                            year: year,
                            month: m
                        });
                    }
                }

                const filtered = allMonths.filter(m => m.year >= 2026);

                bulanSelect.innerHTML = '';
                filtered.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.value;
                    opt.textContent = m.label;
                    bulanSelect.appendChild(opt);
                });

                const currentKey = currentYear + '-' + String(currentMonth + 1).padStart(2, '0');
                if (filtered.some(m => m.value === currentKey)) {
                    bulanSelect.value = currentKey;
                } else {
                    bulanSelect.value = '2026-01';
                }

                updateTotalHari();
            }

            function getBulanTahun() {
                const val = bulanSelect.value;
                const parts = val.split('-');
                return { bulan: parseInt(parts[1]) - 1, tahun: parseInt(parts[0]) };
            }

            function updateTitle() {
                const { bulan, tahun } = getBulanTahun();
                bulanTahunTitle.textContent = NAMA_BULAN[bulan] + ' ' + tahun;
            }

            function updateTotalHari() {
                const { bulan, tahun } = getBulanTahun();
                const daysInMonth = new Date(tahun, bulan + 1, 0).getDate();
                totalHariSpan.textContent = 'Total: ' + daysInMonth + ' hari';
            }

                display.style.textAlign = 'left';
                display.style.verticalAlign = 'top';

                const menu = document.createElement('div');
                menu.className = 'custom-dropdown-menu';

                const header = document.createElement('div');
                header.className = 'menu-header';
                const title = document.createElement('h2');
                title.textContent = '📋 Pilih Nama';
                title.style.textAlign = 'left';
                header.appendChild(title);
                menu.appendChild(header);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';
                menu.appendChild(optionsGrid);

                const footer = document.createElement('div');
                footer.className = 'menu-footer';
                const confirmBtn = document.createElement('button');
                confirmBtn.className = 'btn-confirm';
                confirmBtn.textContent = '✅ OK';
                footer.appendChild(confirmBtn);
                menu.appendChild(footer);

                wrapper.appendChild(display);
                wrapper.appendChild(menu);

                let selectedNames = [];
                if (currentValue && currentValue !== '') {
                    selectedNames = currentValue.split(', ').filter(n => n.trim());
                }

                let isOpen = false;

                function formatDisplay() {
                    if (selectedNames.length === 0) return '— Pilih —';
                    return selectedNames.map((name, i) => (i + 1) + '. ' + name).join('\n');
                }

                function renderOptions() {
                    let html = '';
                    if (daftarNama.length === 0) {
                        html = '<div class="no-result">⚠️ Nama tidak ditemukan. Cek koneksi internet.</div>';
                    } else {
                        daftarNama.forEach(n => {
                            const isSelected = selectedNames.includes(n);
                            let num = '';
                            if (isSelected) {
                                num = (selectedNames.indexOf(n) + 1);
                            }
                            html += `
                                <div class="option-item ${isSelected ? 'selected' : ''}" data-name="${n}">
                                    <span class="num-icon">${num}</span>
                                    ${n}
                                </div>
                            `;
                        });
                    }
                    optionsGrid.innerHTML = html;

                    optionsGrid.querySelectorAll('.option-item').forEach(el => {
                        el.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const name = this.dataset.name;
                            const idx = selectedNames.indexOf(name);
                            if (idx > -1) {
                                selectedNames.splice(idx, 1);
                                this.classList.remove('selected');
                            } else {
                                selectedNames.push(name);
                                this.classList.add('selected');
                            }
                            updateDisplay();
                            renderOptions();
                        });
                    });
                }

                function updateDisplay() {
                    display.innerHTML = '';
                    if (selectedNames.length === 0) {
                        const ph = document.createElement('span');
                        ph.className = 'placeholder';
                        ph.textContent = '— Pilih —';
                        ph.style.textAlign = 'left';
                        display.appendChild(ph);
                    } else {
                        const formatted = document.createTextNode(formatDisplay());
                        display.appendChild(formatted);
                    }
                }

                function openMenu() {
                    if (daftarNama.length === 0) {
                        showToast('⚠️ Daftar nama belum dimuat. Cek koneksi.', 'error');
                        return;
                    }
                    menu.classList.add('open');
                    isOpen = true;
                    renderOptions();
                }

                function closeMenu() {
                    menu.classList.remove('open');
                    isOpen = false;
                }

                display.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (isOpen) {
                        closeMenu();
                    } else {
                        openMenu();
                    }
                });

                confirmBtn.addEventListener('click', function() {
                    closeMenu();
                    const finalValue = selectedNames.join(', ');
                    saveJadwal(tanggal, jenis, finalValue);
                });

                document.addEventListener('click', function(e) {
                    if (!wrapper.contains(e.target) && !menu.contains(e.target)) {
                        closeMenu();
                    }
                });

                renderOptions();
                updateDisplay();

                return wrapper;
            }

            // ============================================================
            //  RENDER PREVIEW
            // ============================================================
            function renderPreview(data) {
                const { bulan, tahun } = getBulanTahun();
                updateTitle();
                updateTotalHari();

                const filtered = data.filter(item => {
                    const parts = item.tanggal_jadwal.split('-');
                    const itemBulan = parseInt(parts[1]) - 1;
                    const itemTahun = parseInt(parts[0]);
                    return itemBulan === bulan && itemTahun === tahun;
                });

                const daysInMonth = new Date(tahun, bulan + 1, 0).getDate();
                const allDates = [];
                for (let d = 1; d <= daysInMonth; d++) {
                    const key = tahun + '-' + String(bulan + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                    allDates.push(key);
                }

                const today = new Date();
                const isCurrentMonth = (tahun === today.getFullYear() && bulan === today.getMonth());

                let sortedDates = [];
                if (isCurrentMonth) {
                    const todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(
                        today.getDate()).padStart(2, '0');
                    const fromToday = [];
                    const beforeToday = [];
                    allDates.forEach(dateKey => {
                        if (dateKey >= todayStr) {
                            fromToday.push(dateKey);
                        } else {
                            beforeToday.push(dateKey);
                        }
                    });
                    sortedDates = fromToday.concat(beforeToday);
                } else {
                    sortedDates = allDates.slice();
                }

                const grouped = {};
                filtered.forEach(item => {
                    const key = item.tanggal_jadwal;
                    if (!grouped[key]) {
                        grouped[key] = { koramil: '', kediaman: '', makodim: '' };
                    }
                    if (item.jenis === 'koramil_hari_ini') {
                        grouped[key].koramil = item.nama1 || '';
                    } else if (item.jenis === 'kediaman_hari_ini') {
                        grouped[key].kediaman = item.nama1 || '';
                    } else if (item.jenis === 'makodim_hari_ini') {
                        grouped[key].makodim = item.nama1 || '';
                    }
                });

                const todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(
                    today.getDate()).padStart(2, '0');

                let html = `
                    <div class="table-wrapper">
                        <table class="excel-table">
                            <thead>
                                <tr>
                                    <th>NO</th>
                                    <th>TANGGAL</th>
                                    <th>KORAMIL</th>
                                    <th>KEDIAMAN</th>
                                    <th>MAKODIM</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                sortedDates.forEach((dateKey, index) => {
                    const entry = grouped[dateKey] || { koramil: '', kediaman: '', makodim: '' };
                    const parts = dateKey.split('-');
                    const d = new Date(parts[0], parts[1] - 1, parts[2]);
                    const dateStr = formatTanggalDuaBaris(d);
                    const isToday = (dateKey === todayStr);
                    const isWeekendDay = isWeekend(d);
                    let rowClass = '';
                    if (isToday) rowClass += ' row-today';
                    if (isWeekendDay) rowClass += ' row-weekend';
                    html += `
                        <tr class="${rowClass}" data-tanggal="${dateKey}">
                            <td style="font-weight:700;text-align:left;vertical-align:top;">${index+1}</td>
                            <td style="text-align:left;vertical-align:top;">${dateStr}</td>
                            <td data-jenis="koramil_hari_ini" style="text-align:left;vertical-align:top;"></td>
                            <td data-jenis="kediaman_hari_ini" style="text-align:left;vertical-align:top;"></td>
                            <td data-jenis="makodim_hari_ini" style="text-align:left;vertical-align:top;"></td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;
                previewContainer.innerHTML = html;

                const rows = previewContainer.querySelectorAll('tr[data-tanggal]');
                rows.forEach(row => {
                    const tanggal = row.dataset.tanggal;
                    const cells = row.querySelectorAll('td[data-jenis]');
                    cells.forEach(cell => {
                        const jenis = cell.dataset.jenis;
                        const key = jenis.replace('_hari_ini', '');
                        const currentValue = (grouped[tanggal] && grouped[tanggal][key]) || '';
                        const dropdown = createCustomDropdown(tanggal, jenis, currentValue);
                        cell.innerHTML = '';
                        cell.style.padding = '2px 4px';
                        cell.style.background = 'transparent';
                        cell.style.textAlign = 'left';
                        cell.style.verticalAlign = 'top';
                        cell.appendChild(dropdown);
                    });
                });
            }

            // ============================================================

            function cetakJadwal() {
                const { bulan, tahun } = getBulanTahun();
                const daysInMonth = new Date(tahun, bulan + 1, 0).getDate();

                const allDates = [];
                for (let d = 1; d <= daysInMonth; d++) {
                    const key = tahun + '-' + String(bulan + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                    allDates.push(key);
                }

                const filtered = allJadwal.filter(item => {
                    const parts = item.tanggal_jadwal.split('-');
                    const itemBulan = parseInt(parts[1]) - 1;
                    const itemTahun = parseInt(parts[0]);
                    return itemBulan === bulan && itemTahun === tahun;
                });

                const grouped = {};
                filtered.forEach(item => {
                    const key = item.tanggal_jadwal;
                    if (!grouped[key]) grouped[key] = { koramil: '', kediaman: '', makodim: '' };
                    if (item.jenis === 'koramil_hari_ini') grouped[key].koramil = item.nama1 || '';
                    else if (item.jenis === 'kediaman_hari_ini') grouped[key].kediaman = item.nama1 || '';
                    else if (item.jenis === 'makodim_hari_ini') grouped[key].makodim = item.nama1 || '';
                });

                function formatNamaWithNumber(namaStr) {
                    if (!namaStr) return '';
                    const names = namaStr.split(',').map(s => s.trim()).filter(s => s);
                    if (names.length === 0) return '';
                    return names.map((n, i) => (i + 1) + '. ' + n).join('\n');
                }

                const today = new Date();
                const todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(
                    today.getDate()).padStart(2, '0');

                let printHtml = `

                    <title>Jadwal Piket Koramil</title>
                    <style>
                        @page {
                            size: A4;
                            margin-top: 1cm;
                            margin-bottom: 1cm;
                            margin-left: 1.5cm;
                            margin-right: 1cm;
                        }

                        }

                            font-weight: bold;
                            font-size: 11pt;
                            text-transform: uppercase;
                        }
                        .kop .koramil {
                            font-weight: bold;
                            font-size: 11pt;
                            text-transform: uppercase;
                        }
                        .kop hr {
                            width: 220px;
                            margin: 4px 0;
                            border: 1px solid #000;
                        }
                        .judul {
                            text-align: center;
                            font-weight: bold;
                            font-size: 11pt;
                            text-transform: uppercase;
                            margin: 14px 0 10px 0;
                        }
                        table {
                            width: 100%;
                            border-collapse: collapse;
                            font-family: Arial, sans-serif;
                            font-size: 11pt;
                            border: 1px solid #000;
                        }
                        th, td {
                            border: 1px solid #000;
                            padding: 2px 4px;
                            text-align: left;
                            vertical-align: top;
                            word-wrap: break-word;
                            overflow-wrap: break-word;
                            white-space: pre-line;
                        }
                        th {
                            background: #d9d9d9;
                            font-weight: 700;
                            font-size: 12pt;
                        }
                        .no-col { width: 6%; text-align: center; }
                        .tgl-col { width: 18%; }
                        .nama-col { width: 28%; }
                        .nama-col-kediaman { width: 24%; }
                        .nama-col-makodim { width: 24%; }
                        .row-weekend td { background: #ffe6e6; }
                        .row-today td { background: #ffff99; }
                        @media print {
                            .no-col, .tgl-col, .nama-col, .nama-col-kediaman, .nama-col-makodim {
                                text-align: left;

                        }
                    </style>
                </head>
                <body>
                    <div class="kop">
                        <div class="kodim">KODIM 1609/BULELENG</div>
                        <div class="koramil">KORAMIL 1609-05/SUKASADA</div>
                        <hr>
                    </div>
                    <div class="judul">DAFTAR JADWAL PIKET KORAMIL 1609-05/SUKASADA</div>
                    <table>
                        <thead>
                            <tr>
                                <th class="no-col">NO</th>
                                <th class="tgl-col">TANGGAL</th>
                                <th class="nama-col">KORAMIL</th>
                                <th class="nama-col-kediaman">KEDIAMAN</th>
                                <th class="nama-col-makodim">MAKODIM</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                allDates.forEach((dateKey, index) => {
                    const entry = grouped[dateKey] || { koramil: '', kediaman: '', makodim: '' };
                    const parts = dateKey.split('-');
                    const d = new Date(parts[0], parts[1] - 1, parts[2]);
                    const dateStr = formatTanggalDuaBaris(d);
                    const isToday = (dateKey === todayStr);
                    const isWeekendDay = isWeekend(d);
                    let rowClass = '';
                    if (isToday) rowClass += ' row-today';
                    if (isWeekendDay) rowClass += ' row-weekend';

                    const koramil = formatNamaWithNumber(entry.koramil);
                    const kediaman = formatNamaWithNumber(entry.kediaman);
                    const makodim = formatNamaWithNumber(entry.makodim);

                    printHtml += `

                printWindow.document.close();
                printWindow.focus();
                printWindow.print();

            // ============================================================
            //  TRIGGER JADWAL (08.00) - VIA WORKER
            // ============================================================
            function setupScheduledTrigger() {
                console.log('⏰ Setting up scheduled trigger at 08.00...');

                function checkAndTrigger() {
                    const now = new Date();
                    const hours = now.getHours();
                    const minutes = now.getMinutes();
                    const seconds = now.getSeconds();

                    if (hours === 0 && minutes === 0 && seconds <= 30) {
                        if (!window._triggerSentToday) {
                            console.log('⏰ Trigger 08.00 - mengirim jadwal ke Telegram via Worker');
                            window._triggerSentToday = true;

                            fetch(WORKER_URL + '/trigger-jadwal')
                                .then(res => res.json())
                                .then(data => {
                                    console.log('✅ Trigger via worker:', data);
                                    if (data.status === 'success') {
                                        showToast('✅ Jadwal otomatis terkirim!', 'success');
                                    }
                                })
                                .catch(err => {
                                    console.warn('⚠️ Worker trigger gagal:', err);
                                });

                            setTimeout(() => {
                                window._triggerSentToday = false;
                            }, 60000);
                        }
                    } else if (hours === 0 && minutes === 1 && seconds === 0) {
                        window._triggerSentToday = false;
                    }
                }

                setInterval(checkAndTrigger, 5000);
                setTimeout(checkAndTrigger, 3000);
                console.log('✅ Scheduled trigger aktif (08.00 WITA) via Worker');
            }

            // ============================================================
            //  REGISTER SERVICE WORKER
            // ============================================================
            function registerServiceWorker() {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('/Hanpangan/sw.js')
                        .then(function(reg) {
                            console.log('✅ Service Worker registered:', reg);
                        })
                        .catch(function(err) {
                            console.warn('⚠️ Service Worker registration failed:', err);
                        });
                } else {
                    console.log('ℹ️ Service Worker not supported');
                }
            }

            // ============================================================
            //  AUTO-REFRESH
            // ============================================================
            let refreshInterval = null;

            function startAutoRefresh() {
                if (refreshInterval) {
                    clearInterval(refreshInterval);
                }
                refreshInterval = setInterval(() => {
                    if (isSupabaseConnected && !isSaving && !isReloading) {
                        loadAllJadwal();
                    }
                }, 30000);
                console.log('🔄 Auto-refresh aktif (30 detik)');
            }

            // ============================================================
            //  INIT
            // ============================================================
            async function init() {
                console.log('🚀 Initializing...');
                console.log('📅 START_DATE:', START_DATE.toISOString().split('T')[0]);
                console.log('📌 START_INDEX:', START_INDEX);
                console.log('🌐 WORKER_URL:', WORKER_URL);
                console.log('🔒 TOKEN di Worker (AMAN!), tidak ada di HTML');

                // Register Service Worker
                registerServiceWorker();

                await checkWorkerStatus();

                const [piketLoaded, hanpanganLoaded] = await Promise.all([
                    loadPiket(),
                    loadHanpangan()
                ]);

                if (!piketLoaded) {
                    showToast('⚠️ Gagal load daftar nama dari GitHub', 'error');
                }
                if (!hanpanganLoaded) {
                    showToast('⚠️ Gagal load hanpangan dari GitHub', 'error');
                }

                populateBulan();
                await initSupabase();

                bulanSelect.addEventListener('change', function() {
                    loadAllJadwal();
                });

                document.getElementById('btnCetak').addEventListener('click', function() {
                    cetakJadwal();
                });

                document.getElementById('btnKirim').addEventListener('click', function() {
                    kirimKeWhatsAppDanTelegram();
                });

                setupScheduledTrigger();
                setupHanpanganScheduler();
                startAutoRefresh();

                setInterval(checkWorkerStatus, 300000);

                console.log('✅ Initialization complete');
                console.log('📊 Daftar nama:', daftarNama.length, 'orang');
                console.log('📊 Hanpangan:', hanpanganData.length, 'data');
                console.log('📊 Current Hanpangan:', currentHanpangan);
                console.log('📊 Supabase:', isSupabaseConnected ? 'Connected' : 'Disconnected');

                console.log('📱 1 Tombol untuk WhatsApp + Telegram (LANGSUNG KIRIM!)');

            window.__app = {
                loadAllJadwal,
                saveJadwal,
                daftarNama,
                allJadwal,
                hanpanganData,
                currentHanpangan,
                isSupabaseConnected,
                reload: loadAllJadwal,
                cetak: cetakJadwal,
                kirimKeWhatsAppDanTelegram: kirimKeWhatsAppDanTelegram,
                sendToTelegramViaWorker: sendToTelegramViaWorker,
                sendScheduleToTelegram: sendScheduleToTelegram,
                loadHanpangan: loadHanpangan,
                parseCSV: parseCSV,
                getEpochDay: getEpochDay,
                getHanpanganToday: getHanpanganToday,
                updateHanpanganDisplay: updateHanpanganDisplay,
                START_DATE: START_DATE,
                START_INDEX: START_INDEX,
                WORKER_URL: WORKER_URL,
                checkWorkerStatus: checkWorkerStatus
            };

        })();
