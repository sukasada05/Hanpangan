<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jadwal Piket Koramil</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* --- GAYA UMUM --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --sticky-top-height: 145px; }
        
        /* Mengizinkan scroll horizontal di layar utama */
        html, body { height: 100%; width: 100%; overflow-x: auto; overflow-y: auto; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f0f0; color: #000000; padding: 0; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        
        .container { max-width: 100%; width: 100%; min-height: 100vh; background: #ffffff; padding: 0 10px 16px; border: none; box-shadow: none; }
        .sticky-top { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; background: #ffffff; padding: 12px 10px 1px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* --- HEADER --- */
        .app-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 12px; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
        .app-header h1 { font-size: clamp(20px, 4vw, 32px); font-weight: 900; letter-spacing: 2px; text-align: left; }
        .header-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: center; gap: 8px 12px; position: relative; top: 8px; width: 100%; }
        .header-actions .month-picker { grid-column: 1; grid-row: 1; display: block; min-width: 0; }
        .header-actions .month-picker select { width: 100%; min-width: 0; }
        #btnCetak { grid-column: 2; grid-row: 1; width: 100%; justify-content: center; }
        #btnKirim { grid-column: 1 / -1; grid-row: 2; width: 100%; justify-content: center; }
        .btn-cetak { background: #000000; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 6px; font-size: clamp(13px, 1vw, 16px); transition: 0.2s; }
        .btn-cetak:hover { background: #000000; }

        .btn-kirim {
            background: #000000;
            color: #ffffff;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: clamp(14px, 1.1vw, 18px);
            transition: 0.2s;
            letter-spacing: 0.5px;
            text-shadow: 0 0 4px rgba(255,255,255,0.3);
        }
        .btn-kirim:hover { background: #000000; transform: scale(1.02); }
        .btn-kirim:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-kirim i { margin-right: 2px; color: #ffffff; }

        /* --- RUNNING TEXT --- */
        .running-container { background: #064e3b; padding: 10px 16px; margin: 0 0 16px 0; overflow: hidden; white-space: nowrap; border-radius: 0; }
        .running-text { display: inline-block; white-space: nowrap; animation: marquee 30s linear infinite; color: #ffd700; font-weight: 700; font-size: clamp(16px, 2.2vw, 24px); padding-left: 100%; letter-spacing: 1px; text-align: left; }
        .running-container:hover .running-text { animation-play-state: paused; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-200%); } }

        /* --- MONTH PICKER --- */
        .month-picker { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; padding: 8px 0; background: transparent; text-align: left; }
        .header-actions .month-picker { margin-bottom: 0; padding: 0; }
        .month-picker label { display: none; }
        .month-picker select { padding: 6px 12px; border: 1px solid #000000; background: #000000; color: #fff; font-family: inherit; font-size: clamp(14px, 1.2vw, 17px); min-width: 150px; cursor: pointer; text-align: left; }
        .month-picker select option { background: #000000; color: #ffffff; }
        .month-picker .total-hari { display: none; }

        /* --- TABEL (AUTO WIDTH TANPA WRAPPER OVERFLOW) --- */
        .preview-section { padding: calc(var(--sticky-top-height) + 2px) 0 0; background: transparent; margin-top: 0; position: relative; }
        .preview-section h3 { display: none; }
        
        .table-wrapper { 
            width: 100%; 
            position: relative; 
            /* overflow dihapus agar sticky bekerja sempurna */
        }
        
        .excel-table { 
            width: max-content; /* Memaksa lebar tabel mengikuti isi */
            min-width: 100%; 
            table-layout: auto; /* Mengikuti lebar konten */
            border-collapse: separate; 
            border-spacing: 0;
            font-size: clamp(13px, 1.1vw, 16px); 
        }
        
        /* Garis Tabel */
        .excel-table th, .excel-table td { 
            border-right: 1px solid #000000 !important; 
            border-bottom: 1px solid #000000 !important; 
            background-color: #ffffff;
            color: #000000;
            padding: 6px 8px;
            vertical-align: top;
            text-align: left;
            white-space: pre-line;
        }

        /* HEADER TABEL (FREEZE VERTIKAL) */
        .excel-table thead th {
            background: #064e3b !important;
            color: #ffffff !important;
            font-weight: 900 !important;
            font-size: clamp(14px, 1.2vw, 18px) !important;
            text-shadow: 0 0 8px rgba(255,255,255,0.15);
            letter-spacing: 1px;
            border-top: 1px solid #064e3b !important;
            border-left: 1px solid #064e3b !important;
            padding: 10px 8px !important;
            white-space: nowrap;
            position: sticky;
            top: var(--sticky-top-height);
            z-index: 50; 
            text-align: center !important;
            vertical-align: middle !important;
            box-shadow: inset 0 -2px 0 #ffffff, 0 2px 4px rgba(0,0,0,0.3);
        }

        /* --- FREEZE KOLOM KIRI (NO & TANGGAL) --- */
        /* Kolom NO (Isi Tabel) */
        .excel-table td:nth-child(1) {
            width: 45px; min-width: 45px; max-width: 45px;
            text-align: center;
            font-weight: 700;
            background-color: #f5f5f5;
            position: sticky;
            left: 0;
            z-index: 40;
            vertical-align: middle;
        }
        /* Kolom NO (Header) */
        .excel-table th:nth-child(1) { 
            width: 45px; min-width: 45px; max-width: 45px;
            text-align: center;
            font-weight: 900;
            background-color: #064e3b !important;
            color: #ffffff !important;
            position: sticky;
            left: 0;
            z-index: 60; 
            vertical-align: middle;
        }

        /* Kolom TANGGAL (Isi Tabel) */
        .excel-table td:nth-child(2) { 
            min-width: 130px; 
            vertical-align: top; 
            position: sticky; 
            left: 45px; 
            z-index: 30;
            color: #000000 !important; 
            font-weight: 900 !important;
            font-size: clamp(15px, 1.3vw, 20px) !important;
            line-height: 1.2;
        }
        /* Kolom TANGGAL (Header) */
        .excel-table th:nth-child(2) { 
            min-width: 130px; 
            vertical-align: top; 
            position: sticky; 
            left: 45px; 
            z-index: 60; 
            background-color: #064e3b !important; 
            color: #ffffff !important; 
            text-align: center !important;
        }

        /* Kolom Lainnya (AUTO WIDTH) */
        .excel-table th:nth-child(3), .excel-table td:nth-child(3) { min-width: 200px; vertical-align: top; }
        .excel-table th:nth-child(4), .excel-table td:nth-child(4),
        .excel-table th:nth-child(5), .excel-table td:nth-child(5) { min-width: 180px; vertical-align: top; }

        /* Warna Baris Spesial */
        .row-today td { background: #ffff99 !important; }
        .row-today td:nth-child(2) { background-color: #ffff99 !important; color: #000000 !important; }
        .row-weekend td { background: #ffe6e6 !important; }
        .row-weekend td:nth-child(2) { background-color: #ffe6e6 !important; color: #000000 !important; }

        .excel-table .no-data { color: #888; text-align: center; padding: 40px 0; font-weight: 600; font-size: clamp(14px, 1.2vw, 18px); }

        /* --- DROPDOWN DALAM TABEL (MENGIKUTI LEBAR TEKS) --- */
        .excel-table td[data-jenis] { 
            position: relative; 
            padding: 0 !important; 
            vertical-align: top; 
        }
        
        .custom-dropdown-wrapper { 
            width: 100%; 
            height: 100%;
            cursor: pointer; 
            display: flex; 
            flex-direction: column;
        }
        
        .selected-names { 
            display: flex; 
            flex-direction: column;
            width: 100%; 
            height: 100%; 
            min-height: 33px; 
            box-sizing: border-box; 
            padding: 6px 8px; 
            background: transparent;
            color: #000; 
            font-weight: 700; 
            line-height: 1.4; 
            white-space: pre-line; 
            cursor: pointer; 
            transition: background 0.2s;
            word-wrap: break-word;
        }
        
        .selected-names:hover { background: #f0f7ff; }
        .selected-names:not(.has-value) { justify-content: center; align-items: center; text-align: center; }
        .selected-names.has-value { justify-content: flex-start; align-items: flex-start; text-align: left; }
        
        .selected-names .placeholder {
            color: #000000 !important; font-weight: 900 !important;
            font-size: clamp(14px, 1.2vw, 18px) !important; letter-spacing: 0.5px;
        }

        /* --- MENU DROPDOWN (DESKTOP: MELAYANG) --- */
        .custom-dropdown-menu {
            display: none; position: fixed; background: #ffffff; border: 2px solid #000;
            z-index: 999999; max-height: 250px; overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3); border-radius: 0; padding: 4px 0;
            min-width: 220px; max-width: 90vw;
        }
        .custom-dropdown-menu.open { display: block; }
        
        .custom-dropdown-menu .option-item {
            padding: 12px 16px; cursor: pointer; font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 15px; font-weight: 700; border-bottom: 1px solid #eee;
            display: flex; justify-content: space-between; align-items: center;
            background: #fff; color: #000; transition: background 0.15s; white-space: normal;
        }
        .custom-dropdown-menu .option-item:last-child { border-bottom: none; }
        .custom-dropdown-menu .option-item:hover { background: #f0f7ff; }
        .custom-dropdown-menu .option-item.selected { background: #e6f7ff; color: #0066cc; }
        .custom-dropdown-menu .option-item.selected::after {
            content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
            color: #0066cc; font-size: 16px; margin-left: 10px;
        }

        .menu-header-mobile, .menu-footer-mobile { display: none !important; }
        .options-list { display: block; }

        /* --- MOBILE FULL SCREEN MENU --- */
        @media (max-width: 768px) {
            .container { padding: 0 14px 12px; }
            .sticky-top { padding: 12px 14px 1px; }
            .month-picker { flex-direction: column; align-items: stretch; text-align: left; }
            .month-picker .total-hari { margin-left: 0; text-align: left; }
            .excel-table th, .excel-table td { padding: 4px 6px; font-size: 12px; text-align: left; vertical-align: top; }
            .excel-table td:nth-child(2) { font-size: clamp(14px, 1.6vw, 18px) !important; }
            .selected-names { font-size: 14px; line-height: 1.5; padding: 4px 6px; }
            .selected-names .placeholder { font-size: clamp(12px, 1.5vw, 15px) !important; }
            
            .header-actions { width: 100%; }
            .excel-table thead th { font-size: clamp(12px, 1.5vw, 15px) !important; padding: 8px 4px !important; text-align: center !important; }

            .custom-dropdown-menu { top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; max-height: 100vh !important; border: none; border-radius: 0; padding: 0; background: #f4f4f4; display: none; flex-direction: column; }
            .custom-dropdown-menu.open { display: flex !important; }
            
            .menu-header-mobile { display: flex !important; justify-content: space-between; align-items: center; padding: 16px 20px; background: #064e3b; color: #fff; border-bottom: 2px solid #000; flex-shrink: 0; }
            .menu-header-mobile h3 { font-size: 18px; font-weight: 700; }
            .btn-close-menu { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }

            .options-list { flex: 1; overflow-y: auto; padding: 10px; }
            .custom-dropdown-menu .option-item { background: #ffffff; margin-bottom: 8px; border-radius: 0; border: 1px solid #aaa; font-size: 16px; padding: 14px 18px; }
            .custom-dropdown-menu .option-item.selected { border-color: #0066cc; background: #e6f7ff; }

            .menu-footer-mobile { display: block !important; padding: 16px 20px; background: #ffffff; border-top: 2px solid #000; flex-shrink: 0; }
            .btn-save-menu { width: 100%; padding: 15px; background: #000; color: #fff; font-size: 16px; font-weight: 700; border: none; border-radius: 0; cursor: pointer; letter-spacing: 1px; }
        }

        /* --- INDIKATOR SUPABASE --- */
        .supabase-indicator { position: fixed; top: 12px; right: 14px; width: 25px; height: 22px; z-index: 99999; display: flex; align-items: flex-end; justify-content: space-between; gap: 2px; padding: 2px; }
        .supabase-indicator span { display: block; flex: 1; height: var(--bar-height); border-radius: 0; background: #ffffff; }
        .supabase-indicator.online span { background: #ffffff; }
        .supabase-indicator span:nth-child(1) { --bar-height: 5px; }
        .supabase-indicator span:nth-child(2) { --bar-height: 9px; }
        .supabase-indicator span:nth-child(3) { --bar-height: 13px; }
        .supabase-indicator span:nth-child(4) { --bar-height: 17px; }
        .supabase-indicator.offline span { height: 4px; }
        .supabase-indicator.checking span { animation: signal-rise 0.8s ease-in-out infinite alternate; }
        .supabase-indicator.checking span:nth-child(2) { animation-delay: 0.15s; }
        .supabase-indicator.checking span:nth-child(3) { animation-delay: 0.3s; }
        .supabase-indicator.checking span:nth-child(4) { animation-delay: 0.45s; }
        @keyframes signal-rise { from { height: 4px; opacity: 0.45; } to { height: var(--bar-height); opacity: 1; } }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .save-indicator { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-left: 8px; transition: all 0.3s; position: absolute; bottom: 4px; right: 4px; }
        .save-indicator.saving { background: #ffcc00; animation: blink 0.3s infinite; }
        .save-indicator.saved { background: #00aa00; }
        .save-indicator.error { background: #cc0000; }

        .footer-text { text-align: center; font-size: clamp(10px, 0.8vw, 13px); color: #999; margin-top: 18px; border-top: 1px solid #ddd; padding-top: 14px; }

        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; border-top: 2px solid transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .container { padding: 0 10px 8px; }
            .sticky-top { padding: 8px 10px 1px; }
            .app-header h1 { font-size: 18px; text-align: left; }
            .running-text { font-size: 14px; animation-duration: 20px; text-align: left; }
            .month-picker select { padding: 6px 10px; font-size: 13px; min-width: 120px; text-align: left; }
            .excel-table th, .excel-table td { padding: 3px 4px; font-size: 10px; text-align: left; vertical-align: top; }
            .excel-table td:nth-child(2) { font-size: clamp(13px, 1.8vw, 16px) !important; line-height: 1.2; }
            .preview-section h3 { font-size: 15px; text-align: left; }
            .selected-names { font-size: 13px; line-height: 1.4; padding: 4px 5px; }
            .selected-names .placeholder { font-size: clamp(11px, 1.5vw, 13px) !important; }
            .supabase-indicator { width: 22px; height: 20px; top: 6px; right: 8px; }
            .excel-table thead th { font-size: clamp(11px, 1.5vw, 13px) !important; padding: 6px 3px !important; text-align: center !important; }
        }
    </style>
</head>
<body>

    <div id="supabaseIndicator" class="supabase-indicator checking" role="img" aria-label="Memeriksa koneksi Supabase">
        <span></span><span></span><span></span><span></span>
    </div>

    <div class="container">

        <div class="sticky-top">
            <div class="running-container">
                <div class="running-text" id="runningTextJadwal">🌾 Memuat jadwal hanpangan... 🌾</div>
            </div>

            <div class="app-header">
            <div class="header-actions">
                <div class="month-picker">
                    <label for="bulanSelect">📅 Bulan:</label>
                    <select id="bulanSelect"></select>
                    <span class="total-hari" id="totalHari">Total: 31 hari</span>
                </div>
                <button id="btnKirim" class="btn-kirim">
                    <i class="fab fa-whatsapp"></i>
                    Kirim KE WHATSAPP
                </button>
                <button id="btnCetak" class="btn-cetak">
                    <i class="fas fa-print"></i> Cetak
                </button>
            </div>
            </div>
        </div>

        <div class="preview-section">
            <h3>📋 JADWAL <span id="bulanTahunTitle">Bulan Ini</span></h3>
            <div id="previewContainer">
                <div class="no-data">⏳ Memuat data...</div>
            </div>
        </div>

        <div class="footer-text">Data tersimpan di Supabase • Auto-save on</div>

    </div>

    <script>
        (function() {
            // ============================================================
            //  KONFIGURASI
            // ============================================================
            const START_DATE = new Date(2026, 6, 25);
            const START_INDEX = 1;

            const HANPANGAN_URL = "https://raw.githubusercontent.com/sukasada05/dukops4/main/data/hanpangan.csv";
            const PIKET_URL = "https://raw.githubusercontent.com/sukasada05/dukops4/main/data/piket.txt";
            const SUPABASE_URL = 'https://wausfsflcehizpuqdwbg.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhdXNmc2ZsY2VoaXpwdXFkd2JnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxMTA3ODQsImV4cCI6MjA5ODY4Njc4NH0.2zF7iogzuTwWoQc451-uKxQdNN1C-qkB0O9Jvz1ZoI0';

            let supabaseClient = null;
            let isSupabaseConnected = false;
            let daftarNama = [];
            let hanpanganData = [];
            let currentHanpangan = null;
            let allJadwal = [];
            let isSaving = false;
            let isReloading = false;
            let lastReloadTime = 0;
            let isInitialLoad = true;

            const bulanSelect = document.getElementById('bulanSelect');
            const bulanTahunTitle = document.getElementById('bulanTahunTitle');
            const previewContainer = document.getElementById('previewContainer');
            const indicator = document.getElementById('supabaseIndicator');
            const totalHariSpan = document.getElementById('totalHari');
            const btnKirim = document.getElementById('btnKirim');
            const stickyTop = document.querySelector('.sticky-top');

            function updateStickyTopHeight() {
                document.documentElement.style.setProperty('--sticky-top-height', stickyTop.offsetHeight + 'px');
            }

            updateStickyTopHeight();
            window.addEventListener('resize', updateStickyTopHeight);
            if ('ResizeObserver' in window) {
                new ResizeObserver(updateStickyTopHeight).observe(stickyTop);
            }

            const NAMA_HARI = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
            const NAMA_BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September",
                "Oktober", "November", "Desember"
            ];

            // ============================================================
            //  UTILITY FUNCTIONS
            // ============================================================
            function getEpochDay(date) {
                const ref = new Date(2024, 0, 1);
                ref.setHours(0, 0, 0, 0);
                const d = new Date(date);
                d.setHours(0, 0, 0, 0);
                const diffTime = d.getTime() - ref.getTime();
                return Math.floor(diffTime / (24 * 60 * 60 * 1000));
            }

            function getHanpanganToday(data, date) {
                if (!data || data.length === 0) return null;
                const startEpoch = getEpochDay(START_DATE);
                const todayEpoch = getEpochDay(date);
                const dayDiff = todayEpoch - startEpoch;
                const idx = ((START_INDEX + dayDiff) % data.length + data.length) % data.length;
                return data[idx];
            }

            function formatTanggalDuaBaris(date) {
                return NAMA_HARI[date.getDay()] + ',\n' +
                    date.getDate() + ' ' +
                    NAMA_BULAN[date.getMonth()] + ' ' +
                    date.getFullYear();
            }

            function formatTanggalWA(date) {
                return NAMA_HARI[date.getDay()] + ', ' +
                    date.getDate() + ' ' +
                    NAMA_BULAN[date.getMonth()] + ' ' +
                    date.getFullYear();
            }

            function isWeekend(date) {
                const day = date.getDay();
                return day === 0 || day === 6;
            }

            function updateIndicator(status) {
                indicator.className = 'supabase-indicator';
                if (status === 'online') {
                    indicator.classList.add('online');
                    indicator.setAttribute('aria-label', 'Supabase terhubung');
                } else if (status === 'offline') {
                    indicator.classList.add('offline');
                    indicator.setAttribute('aria-label', 'Supabase tidak terhubung');
                } else {
                    indicator.classList.add('checking');
                    indicator.setAttribute('aria-label', 'Memeriksa koneksi Supabase');
                }
            }

            function fetchText(url) {
                return fetch(url + '?t=' + Date.now())
                    .then(r => {
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.text();
                    })
                    .catch(() => null);
            }

            // ============================================================
            //  UPDATE HANPANGAN
            // ============================================================
            function updateHanpanganDisplay() {
                const today = new Date();
                currentHanpangan = getHanpanganToday(hanpanganData, today);
                const runningText = document.getElementById('runningTextJadwal');
                if (currentHanpangan) {
                    runningText.textContent = '🌾 JADWAL HANPANGAN HARI INI: ' +
                        (currentHanpangan.nama || 'Tidak ada') + ' 🌾';
                } else {
                    runningText.textContent = '🌾 Memuat jadwal hanpangan... 🌾';
                }
            }

            function parseCSV(csvText) {
                const lines = csvText.trim().split('\n');
                if (lines.length < 2) return [];
                const headerLine = lines[0];
                let delimiter = '\t';
                if (headerLine.includes('\t')) delimiter = '\t';
                else if (headerLine.includes(',')) delimiter = ',';
                else if (headerLine.includes(';')) delimiter = ';';
                const data = [];
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    const cols = line.split(delimiter);
                    if (cols.length >= 3) {
                        data.push({
                            nama: cols[0].trim(),
                            desa: cols[1].trim(),
                            status: cols[2].trim()
                        });
                    }
                }
                return data;
            }

            async function initSupabase() {
                updateIndicator('checking');

                    if (typeof supabase === 'undefined') {
                        updateIndicator('offline');
                        return false;
                    }
                    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    const { error } = await supabaseClient.from('jadwal_piket').select('id').limit(1);
                    if (error) {

                        return false;
                    }
                    isSupabaseConnected = true;

            async function loadAllJadwal() {
                const now = Date.now();
                if (now - lastReloadTime < 1000) return;
                lastReloadTime = now;
                if (isReloading) return;

                if (!supabaseClient || !isSupabaseConnected) {
                    previewContainer.innerHTML = '<div class="no-data">⚠️ Supabase tidak terhubung</div>';
                    return;
                }

                isReloading = true;
                try {
                    const { data, error } = await supabaseClient
                        .from('jadwal_piket')
                        .select('*')
                        .order('tanggal_jadwal', { ascending: true });
                    if (error) throw error;
                    allJadwal = data || [];
                    populateBulan();
                    renderPreview(allJadwal);
                    if (isInitialLoad) {
                        isInitialLoad = false;
                    }
                } catch (e) {
                    previewContainer.innerHTML = '<div class="no-data">❌ Gagal memuat data</div>';
                } finally {
                    isReloading = false;
                }
            }

            function showSaveIndicator(element, status) {

                    indicator.className = 'save-indicator';

            // ============================================================
            //  SAVE JADWAL
            // ============================================================
            async function saveJadwal(tanggal, jenis, nama) {
                if (!supabaseClient || !isSupabaseConnected) {
                    console.error('Gagal simpan: Supabase tidak terhubung.');
                    return false;
                }

                if (isSaving) return false;
                isSaving = true;

                const cells = document.querySelectorAll(`td[data-jenis="${jenis}"]`);
                let targetCell = null;
                for (let cell of cells) {
                    const row = cell.closest('tr');
                    if (row && row.dataset.tanggal === tanggal) {
                        targetCell = cell;
                        break;
                    }
                }

                if (targetCell) {
                    showSaveIndicator(targetCell, 'saving');
                }

                try {
                    const { data: existing, error: findErr } = await supabaseClient
                        .from('jadwal_piket')
                        .select('id, nama1, nama2')
                        .eq('tanggal_jadwal', tanggal)
                        .eq('jenis', jenis)
                        .maybeSingle();
                    if (findErr) throw findErr;

                    const oldValue = existing ? (existing.nama1 || '') : '';
                    const newValue = nama || '';

                    if (oldValue === newValue) {
                        if (targetCell) {
                            showSaveIndicator(targetCell, 'saved');
                            setTimeout(() => showSaveIndicator(targetCell, ''), 1000);
                        }
                        isSaving = false;
                        return true;
                    }

                    let result;
                    if (existing) {
                        result = await supabaseClient
                            .from('jadwal_piket')
                            .update({
                                nama1: nama || null,
                                nama2: null,
                                tanggal_input: new Date().toISOString()
                            })
                            .eq('id', existing.id);
                    } else {
                        result = await supabaseClient
                            .from('jadwal_piket')
                            .insert([{
                                tanggal_jadwal: tanggal,
                                jenis: jenis,
                                nama1: nama || null,
                                nama2: null,
                                tanggal_input: new Date().toISOString()
                            }]);
                    }
                    if (result.error) throw result.error;

                    console.log('✅ Save success:', tanggal, jenis, nama);

                    if (targetCell) {
                        showSaveIndicator(targetCell, 'saved');
                    }

                    return true;
                } catch (e) {
                    console.error('❌ Gagal simpan:', e);
                    if (targetCell) {
                        showSaveIndicator(targetCell, 'error');
                    }
                    return false;
                } finally {
                    isSaving = false;
                }
            }

            // ============================================================
            //  DROPDOWN CUSTOM
            // ============================================================
            function createCustomDropdown(tanggal, jenis, currentValue) {
                const wrapper = document.createElement('div');
                wrapper.className = 'custom-dropdown-wrapper';

                const display = document.createElement('div');
                display.className = 'selected-names';
                
                const columnNames = {
                    koramil_hari_ini: 'KORAMIL',
                    kediaman_hari_ini: 'KEDIAMAN',
                    makodim_hari_ini: 'MAKODIM'
                };
                const placeholderText = `${(columnNames[jenis] || 'NAMA')}`;

                const savedNames = currentValue ? currentValue.split(',').map(nama => nama.trim()).filter(Boolean) : [];
                let selectedNames = [...savedNames];

                const updateDisplay = () => {
                    if (selectedNames.length > 0) {
                        display.innerHTML = selectedNames.map((nama, i) => `${i + 1}. ${nama}`).join('<br>');
                        display.classList.add('has-value');
                    } else {
                        display.innerHTML = `<span class="placeholder">${placeholderText}</span>`;
                        display.classList.remove('has-value');
                    }
                };
                updateDisplay();

                const menu = document.createElement('div');
                menu.className = 'custom-dropdown-menu';

                // --- Header (Khusus Mobile) ---
                const headerMobile = document.createElement('div');
                headerMobile.className = 'menu-header-mobile';
                headerMobile.innerHTML = `<h3>Pilih ${placeholderText}</h3> <button type="button" class="btn-close-menu"><i class="fas fa-times"></i></button>`;
                menu.appendChild(headerMobile);

                // --- List Opsi ---
                const optionsList = document.createElement('div');
                optionsList.className = 'options-list';
                
                const allNames = [...new Set([...savedNames, ...daftarNama])];
                allNames.forEach(nama => {
                    const opt = document.createElement('div');
                    opt.className = 'option-item';
                    opt.textContent = nama;
                    if (selectedNames.includes(nama)) opt.classList.add('selected');

                    opt.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (selectedNames.includes(nama)) {
                            selectedNames = selectedNames.filter(n => n !== nama);
                            opt.classList.remove('selected');
                        } else {
                            selectedNames.push(nama);
                            opt.classList.add('selected');
                        }
                        updateDisplay();
                    });
                    optionsList.appendChild(opt);
                });
                menu.appendChild(optionsList);

                // --- Footer (Khusus Mobile) ---
                const footerMobile = document.createElement('div');
                footerMobile.className = 'menu-footer-mobile';
                const btnSave = document.createElement('button');
                btnSave.className = 'btn-save-menu';
                btnSave.textContent = 'SELESAI';
                footerMobile.appendChild(btnSave);
                menu.appendChild(footerMobile);

                // --- Fungsi Tutup Menu ---
                const closeMenu = () => {
                    menu.classList.remove('open');
                    document.body.style.overflow = ''; // Kembalikan scroll body
                    if (menu._onClose) menu._onClose();
                };

                headerMobile.querySelector('.btn-close-menu').addEventListener('click', (e) => {
                    e.stopPropagation();
                    closeMenu();
                });
                btnSave.addEventListener('click', (e) => {
                    e.stopPropagation();
                    closeMenu();
                });

                // --- Klik pada kotak display ---
                display.addEventListener('click', (e) => {
                    e.stopPropagation();
                    
                    // Tutup menu lain jika ada
                    document.querySelectorAll('.custom-dropdown-menu.open').forEach(m => {
                        m.classList.remove('open');
                        if (m._onClose) m._onClose();
                    });

                    if (window.innerWidth <= 768) {
                        // Mode Mobile: Full Screen
                        menu.classList.add('open');
                        document.body.style.overflow = 'hidden'; // Kunci scroll background
                    } else {
                        // Mode Desktop: Melayang
                        const rect = display.getBoundingClientRect();
                        menu.style.top = (rect.bottom + 2) + 'px';
                        
                        let leftPos = rect.left;
                        if (leftPos + 220 > window.innerWidth) {
                            leftPos = window.innerWidth - 230;
                        }
                        menu.style.left = Math.max(10, leftPos) + 'px';
                        
                        menu.classList.add('open');

                        setTimeout(() => {
                            const menuRect = menu.getBoundingClientRect();
                            if (menuRect.bottom > window.innerHeight) {
                                menu.style.top = (rect.top - menuRect.height - 2) + 'px';
                            }
                        }, 0);
                    }
                });

                menu._onClose = () => {
                    const namesStr = selectedNames.join(', ');
                    const oldStr = savedNames.join(', ');
                    // Auto-save jika ada perubahan
                    if (namesStr !== oldStr) {
                        saveJadwal(tanggal, jenis, namesStr);
                    }
                };

                wrapper.appendChild(display);
                document.body.appendChild(menu); // Dipindah ke body

                wrapper._resetDropdown = () => {
                    selectedNames = [];
                    updateDisplay();
                    optionsList.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
                    if (menu.parentNode) menu.parentNode.removeChild(menu);
                };

                return wrapper;
            }

            // ============================================================
            //  BULAN
            // ============================================================
            function populateBulan() {
                const now = new Date();
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();
                const selectedMonth = bulanSelect.value;

                const allMonths = [];
                const firstScheduleDate = allJadwal.reduce((earliest, item) => {
                    return !earliest || item.tanggal_jadwal < earliest
                        ? item.tanggal_jadwal
                        : earliest;
                }, '');
                const earliestScheduleYear = firstScheduleDate
                    ? parseInt(firstScheduleDate.split('-')[0], 10)
                    : currentYear - 2;
                const firstYear = Math.min(currentYear - 2, earliestScheduleYear);

                for (let year = firstYear; year <= currentYear + 2; year++) {
                    for (let m = 0; m < 12; m++) {
                        allMonths.push({
                            value: year + '-' + String(m + 1).padStart(2, '0'),
                            label: NAMA_BULAN[m] + ' ' + year,
                            year: year,
                            month: m
                        });
                    }
                }

                bulanSelect.innerHTML = '';
                allMonths.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.value;
                    opt.textContent = m.label;
                    bulanSelect.appendChild(opt);
                });

                const currentKey = currentYear + '-' + String(currentMonth + 1).padStart(2, '0');
                if (allMonths.some(m => m.value === selectedMonth)) {
                    bulanSelect.value = selectedMonth;
                } else if (allMonths.some(m => m.value === currentKey)) {
                    bulanSelect.value = currentKey;
                } else {
                    bulanSelect.value = allMonths[0].value;
                }

                updateTotalHari();
            }

            function getBulanTahun() {
                const val = bulanSelect.value;
                const parts = val.split('-');
                return { bulan: parseInt(parts[1]) - 1, tahun: parseInt(parts[0]) };
            }

            function getDisplayDates(bulan, tahun) {
                const today = new Date();
                const isCurrentMonth = tahun === today.getFullYear() && bulan === today.getMonth();
                const allDates = [];
                const monthsToShow = isCurrentMonth ? 2 : 1;

                for (let monthOffset = 0; monthOffset < monthsToShow; monthOffset++) {
                    const date = new Date(tahun, bulan + monthOffset, 1);
                    const year = date.getFullYear();
                    const month = date.getMonth();
                    const firstDay = monthOffset === 0 && isCurrentMonth ? today.getDate() : 1;
                    const daysInMonth = new Date(year, month + 1, 0).getDate();

                    for (let day = firstDay; day <= daysInMonth; day++) {
                        allDates.push(year + '-' + String(month + 1).padStart(2, '0') + '-' +
                            String(day).padStart(2, '0'));
                    }
                }

                if (!isCurrentMonth) {
                    const nextMonthFirstDate = new Date(tahun, bulan + 1, 1);
                    allDates.push(nextMonthFirstDate.getFullYear() + '-' +
                        String(nextMonthFirstDate.getMonth() + 1).padStart(2, '0') + '-01');
                }

                return allDates;
            }

            function updateTitle() {
                const { bulan, tahun } = getBulanTahun();
                bulanTahunTitle.textContent = NAMA_BULAN[bulan] + ' ' + tahun;
            }

            function updateTotalHari() {
                const { bulan, tahun } = getBulanTahun();
                const daysInMonth = new Date(tahun, bulan + 1, 0).getDate();
                totalHariSpan.textContent = 'Total: ' + daysInMonth + ' hari';
            }

                        .kop { text-align: left; margin-bottom: 12px; }
                        .kop-wrapper { display: inline-block; border-bottom: 2px solid #000; padding-bottom: 5px; }
                        .kop .kodim, .kop .koramil { font-weight: 900; font-size: 12pt; text-transform: uppercase; line-height: 1.2; letter-spacing: 0.5px; color: #000; }
                        .kop .koramil { margin-left: 25px; margin-top: 4px; }
                        .judul { text-align: center; font-weight: bold; font-size: 11pt; text-transform: uppercase; margin: 15px 0 8px; color: #000; }
                        table { width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; font-size: 9pt; border: 1px solid #000; table-layout: fixed; }
                        th, td { border: 1px solid #000; padding: 4px 5px; text-align: left; vertical-align: top; word-break: normal; overflow-wrap: break-word; white-space: pre-line; color: #000; }
                        th { background: #ffffff !important; color: #000000 !important; font-weight: bold; font-size: 9pt; text-align: center !important; }
                        .no-col { width: 6%; text-align: center; }
                        .tgl-col { width: 17%; font-weight: 900; color: #000; }
                        .nama-col { width: 27%; }
                        .nama-col-kediaman { width: 25%; }
                        .nama-col-makodim { width: 25%; }
                        @media screen {
                            html { background: #e5e7eb; }
                            body { width: 210mm; max-width: calc(100vw - 32px); min-height: 297mm; margin: 16px auto; padding: 15mm; box-sizing: border-box; box-shadow: 0 2px 12px rgba(0,0,0,0.2); }
                        }
                        @media print {
                            body { width: auto; max-width: none; min-height: 0; margin: 0; padding: 0; box-shadow: none; }
                            thead { display: table-header-group; }
                            tr { break-inside: avoid; page-break-inside: avoid; }
                            .no-col { text-align: center; vertical-align: middle; }
                            .tgl-col { text-align: center; }
                        }
                    </style>
                </head>
                <body>
                    <div class="kop">
                        <div class="kop-wrapper">
                            <div class="kodim">KOMANDO DISTRIK MILITER 1609/BULELENG</div>
                            <div class="koramil">KOMANDO RAYON MILITER 1609-05</div>
                        </div>
                    </div>

                    <div class="judul">DAFTAR JADWAL PIKET KORAMIL 1609-05/SUKASADA<br>${NAMA_BULAN[bulan].toUpperCase()} ${tahun}</div>

                    <table>
                        <thead>
                            <tr>
                                <th class="no-col" style="text-align:center !important;">NO</th>
                                <th class="tgl-col" style="text-align:center !important;">TANGGAL</th>
                                <th class="nama-col" style="text-align:center !important;">KORAMIL</th>
                                <th class="nama-col-kediaman" style="text-align:center !important;">KEDIAMAN</th>
                                <th class="nama-col-makodim" style="text-align:center !important;">MAKODIM</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                allDates.forEach((dateKey, index) => {
                    const entry = grouped[dateKey] || { koramil: '', kediaman: '', makodim: '' };
                    const parts = dateKey.split('-');
                    const d = new Date(parts[0], parts[1] - 1, parts[2]);
                    const dateStr = formatTanggalDuaBaris(d);

                    const koramil  = formatNamaWithNumber(entry.koramil);
                    const kediaman = formatNamaWithNumber(entry.kediaman);
                    const makodim  = formatNamaWithNumber(entry.makodim);

                    printHtml += `
                        <tr>
                            <td class="no-col">${index + 1}</td>
                            <td class="tgl-col">${dateStr}</td>
                            <td class="nama-col">${koramil}</td>
                            <td class="nama-col-kediaman">${kediaman}</td>
                            <td class="nama-col-makodim">${makodim}</td>
                        </tr>
                    `;
                });

                printHtml += `
                        </tbody>
                    </table>
                </body>
                </html>
                `;

                const printWindow = window.open('', '_blank', 'width=800,height=600');
                if (!printWindow) {
                    console.error('Jendela cetak tidak dapat dibuka. Periksa pengaturan popup browser.');
                    return;
                }
                printWindow.document.write(printHtml);
                printWindow.document.close();
                printWindow.focus();
                printWindow.print();
            }

            // ============================================================
            //  SCHEDULER HANPANGAN
            // ============================================================
            function setupHanpanganScheduler() {
                function checkAndUpdateHanpangan() {
                    const now = new Date();
                    const hours = now.getHours();
                    const minutes = now.getMinutes();
                    const seconds = now.getSeconds();

                    if (hours === 0 && minutes === 2 && seconds <= 30) {
                        if (!window._hanpanganUpdatedToday) {
                            window._hanpanganUpdatedToday = true;
                            const today = new Date();
                            const newHanpangan = getHanpanganToday(hanpanganData, today);
                            if (newHanpangan && JSON.stringify(newHanpangan) !== JSON.stringify(currentHanpangan)) {
                                currentHanpangan = newHanpangan;
                                updateHanpanganDisplay();
                            }
                            setTimeout(() => {
                                window._hanpanganUpdatedToday = false;
                            }, 60000);
                        }
                    } else if (hours === 0 && minutes === 3 && seconds === 0) {
                        window._hanpanganUpdatedToday = false;
                    }
                }
                setInterval(checkAndUpdateHanpangan, 5000);
            }

            function registerServiceWorker() {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('sw.js')
                        .then(() => console.log('✅ SW registered'))
                        .catch(() => console.log('ℹ️ SW not registered'));
                }
            }

            let refreshInterval = null;

            function startAutoRefresh() {
                if (refreshInterval) clearInterval(refreshInterval);
                refreshInterval = setInterval(() => {
                    if (isSupabaseConnected && !isSaving && !isReloading) {
                        loadAllJadwal();
                    }
                }, 30000);
            }

            // ============================================================
            //  INIT
            // ============================================================
            async function init() {
                registerServiceWorker();

                const [piketLoaded, hanpanganLoaded] = await Promise.all([
                    loadPiket(),
                    loadHanpangan()
                ]);

                if (!piketLoaded) {
                    console.error('Gagal memuat daftar nama.');
                }
                if (!hanpanganLoaded) {
                    console.error('Gagal memuat data hanpangan.');
                }

                populateBulan();
                await initSupabase();

                bulanSelect.addEventListener('change', loadAllJadwal);
                document.getElementById('btnCetak').addEventListener('click', cetakJadwal);
                document.getElementById('btnKirim').addEventListener('click', kirimKeWhatsApp);

                setupHanpanganScheduler();
                startAutoRefresh();

                // Global listener: klik di luar untuk menutup dropdown & auto-save
                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.selected-names') && !e.target.closest('.custom-dropdown-menu')) {
                        document.querySelectorAll('.custom-dropdown-menu.open').forEach(m => {
                            m.classList.remove('open');
                            document.body.style.overflow = '';
                            if (m._onClose) m._onClose();
                        });
                    }
                });
            }

            document.addEventListener('DOMContentLoaded', init);

            window.__app = {
                loadAllJadwal,
                saveJadwal,
                daftarNama,
                allJadwal,
                hanpanganData,
                currentHanpangan,
                isSupabaseConnected,
                reload: loadAllJadwal,
                cetak: cetakJadwal,
                kirimKeWhatsApp
            };

        })();
    </script>

</body>
